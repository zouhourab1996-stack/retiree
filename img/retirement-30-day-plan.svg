<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Four-week retirement countdown checklist</title><desc id="d">Four steps leading to the final working day: dates, handover, benefits and final checks.</desc><rect width="1200" height="560" rx="32" fill="#f3f0e6"/><text x="72" y="90" fill="#26352d" font-family="Arial,sans-serif" font-size="42" font-weight="700">THE FINAL 30 DAYS</text><text x="72" y="135" fill="#6b756d" font-family="Arial,sans-serif" font-size="23">A calm, practical plan for your last month at work</text><path d="M160 280H1040" stroke="#c7b16c" stroke-width="10" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="180" cy="280" r="66" fill="#294a35"/><text x="180" y="290" fill="#fff" font-size="34" font-weight="700">4</text><text x="180" y="390" fill="#26352d" font-size="25" font-weight="700">WEEK 4</text><text x="180" y="426" fill="#59655d" font-size="19">Dates &amp; papers</text></g><g><circle cx="460" cy="280" r="66" fill="#496b4e"/><text x="460" y="290" fill="#fff" font-size="34" font-weight="700">3</text><text x="460" y="390" fill="#26352d" font-size="25" font-weight="700">WEEK 3</text><text x="460" y="426" fill="#59655d" font-size="19">Handover</text></g><g><circle cx="740" cy="280" r="66" fill="#6b8152"/><text x="740" y="290" fill="#fff" font-size="34" font-weight="700">2</text><text x="740" y="390" fill="#26352d" font-size="25" font-weight="700">WEEK 2</text><text x="740" y="426" fill="#59655d" font-size="19">Pay &amp; benefits</text></g><g><circle cx="1020" cy="280" r="66" fill="#c5a24d"/><text x="1020" y="290" fill="#fff" font-size="34" font-weight="700">1</text><text x="1020" y="390" fill="#26352d" font-size="25" font-weight="700">WEEK 1</text><text x="1020" y="426" fill="#59655d" font-size="19">Final checks</text></g></g><text x="600" y="510" text-anchor="middle" fill="#68736b" font-family="Arial,sans-serif" font-size="18">Confirm dates with your own employer and plan administrator</text></svg>